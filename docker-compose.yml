version: "3.9"

services:


  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379
      CORS_ORIGINS: http://localhost:3000
      ENVIRONMENT: development
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-key-change-in-production}
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./services/api:/app:ro
      - ./db:/app/db:ro

  # Seeder — runs once at startup, then exits
  seeder:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@railpredict.dev}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-ChangeMe123!}
    volumes:
      - ./services/api:/app:ro
      - ./db:/app/db:ro
    command: ["python", "db/seed/seed.py"]
    restart: "no"

  simulator:
    build:
      context: ./services/simulator
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      API_BASE_URL: http://api:8000
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-key-change-in-production}
      TICK_INTERVAL_SECONDS: "30"
      SIMULATOR_STARTUP_DELAY: "45"
    depends_on:
      - api

  live_fetcher:
    build:
      context: ./services/simulator
      dockerfile: Dockerfile
    command: ["python", "live_fetcher.py"]
    restart: unless-stopped
    environment:
      API_BASE_URL: http://api:8000
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-key-change-in-production}
      RAILRADAR_API_KEY: ${RAILRADAR_API_KEY}
    depends_on:
      - api

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
    driver: local
